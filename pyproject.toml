[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.coverage.run]
branch = true
source = ["services", "evaluation", "main"]

[tool.coverage.report]
show_missing = true
