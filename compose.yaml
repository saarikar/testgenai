services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: testgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: testgen
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testgen -d testgen"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://testgen:${POSTGRES_PASSWORD}@db:5432/testgen
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres_data:
