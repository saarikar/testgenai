name: TestGen-AI CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testgen
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: testgen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testgen -d testgen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://testgen:ci-only-password@localhost:5432/testgen_test
      LLM_PROVIDER: groq
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: openai/gpt-oss-120b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest --junitxml=artifacts/junit.xml --cov --cov-fail-under=80 --cov-report=xml:artifacts/coverage.xml --cov-report=html:artifacts/htmlcov
      - run: python -m evaluation.run --mode reference --repeats 1 --output artifacts/reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-evaluation-reports
          path: artifacts/
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t testgen-ai:ci .
      - name: Container health and dashboard smoke test
        run: |
          docker run -d --name testgen-smoke -p 127.0.0.1:8000:8000 -e DATABASE_URL=sqlite:////tmp/testgen.db testgen-ai:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS http://127.0.0.1:8000/ | grep -q 'TestGen'
      - if: always()
        run: docker logs testgen-smoke; docker rm -f testgen-smoke
